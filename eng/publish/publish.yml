        dependsOn: nugetApproval
        condition: and(succeeded('nugetApproval'), ${{ not(containsValue(parameters.skipPackages, 'Microsoft.DurableTask.Client')) }})
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: officialPipeline  # Pipeline reference as defined in the resources section
