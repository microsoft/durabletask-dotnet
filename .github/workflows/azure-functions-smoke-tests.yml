name: Azure Functions Smoke Tests

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths-ignore: [ '**.md' ]
  pull_request:
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: '8.0.x'

    - name: Setup .NET from global.json
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: global.json

    - name: Run smoke tests
      run: |
        cd test/AzureFunctionsSmokeTests
        pwsh -File run-smoketests.ps1
      
    - name: Upload smoke test logs on failure
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: smoke-test-logs
        path: test/AzureFunctionsSmokeTests/logs/
        if-no-files-found: ignore
