# This is our package-publishing pipeline.
# When executed, it automatically publishes the output of the 'official pipeline' (the nupkgs) to our internal ADO feed.
# It may optionally also publish the packages to NuGet, but that is gated behind a manual approval.

parameters:
- name: nuGetOrganization
  displayName: NuGet.org organization confirmed during ESRP onboarding (required)
  type: string
  default: ''
- name: skipPackages
  displayName: Public package IDs to skip for this run (already published or intentionally held back)
  type: object
  default: []

trigger: none # only trigger is manual
pr: none # only trigger is manual

resources:
    repositories:
        - repository: 1es
          type: git
          name: 1ESPipelineTemplates/1ESPipelineTemplates
          ref: refs/tags/release
        - repository: eng
          type: git
          name: engineering
          ref: refs/tags/release

    pipelines:
    - pipeline: officialPipeline # Reference to the pipeline to be used as an artifact source
      source: 'durabletask-dotnet.official'

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
        name: 1es-pool-azfunc
        image: 1es-windows-2022
        os: windows

    stages:
    - stage: release
      jobs:

      # ADO release
      - job: AdoRelease
        displayName: ADO Release
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: officialPipeline  # Pipeline reference, as defined in the resources section
            artifactName: drop
            targetPath: $(System.DefaultWorkingDirectory)/drop
        steps:
        - task: 1ES.PublishNuget@1
          displayName: 'Push to durabletask ADO feed'
          inputs:
            command: push
            packageParentPath: $(System.DefaultWorkingDirectory) # This needs to be set to some prefix of the `packagesToPush` parameter. Apparently it helps with SDL tooling
            packagesToPush: '$(System.DefaultWorkingDirectory)/**/*.nupkg;!$(System.DefaultWorkingDirectory)/**/*.symbols.nupkg'
            publishVstsFeed: '3f99e810-c336-441f-8892-84983093ad7f/c895696b-ce37-4fe7-b7ce-74333a04f8bf'
            allowPackageConflicts: true
  
      # NuGet approval gate
      - job: nugetApproval
        displayName: NuGetApproval
        dependsOn: AdoRelease
        pool: server # This task only works when executed on serverl pools, so this needs to be specified
        steps:
          # Wait for manual approval. 
          - task: ManualValidation@1
            inputs:
              instructions: |
                Selected NuGet.org organization: ${{ parameters.nuGetOrganization }}
                Confirm that this is the organization approved during ESRP NuGet onboarding.
                Confirm the Durable ESRP client is allowlisted for ESRPRELPACMAN and the NuGet
                Trusted Publishing policy covers the selected package IDs/prefixes and operations.
                Validate the selected signed official build, package exclusions and dependency availability.
                Stop here for a validation-only trial or if any prerequisite remains unverified.
                Approving this gate starts public ESRP NuGet submissions.
              onTimeout: 'reject'

      #================== NuGet publishing section ==================
      # Keep one package per ESRP submission: duplicate versions fail independently, and ESRP
      # does not guarantee publication order within a submission. Preserve the dependency jobs below.
      # skipPackages applies only to this run; it does not remove future releases of a package.
      # The shared steps select the exact nuspec ID, not a filename prefix, from the signed drop.

      # NuGet release (Microsoft.DurableTask.Abstractions)
      - job: nugetRelease_Microsoft_DurableTask_Abstractions
        displayName: NuGet Release (Microsoft.DurableTask.Abstractions)
        dependsOn: nugetApproval
        condition: and(succeeded('nugetApproval'), ${{ not(containsValue(parameters.skipPackages, 'Microsoft.DurableTask.Abstractions')) }})
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: officialPipeline  # Pipeline reference as defined in the resources section
            artifactName: drop
            targetPath: $(System.DefaultWorkingDirectory)/drop
        steps:
        - template: /eng/publish/nuget-release-steps.yml@self
          parameters:
            packageId: Microsoft.DurableTask.Abstractions
            organizationName: ${{ parameters.nuGetOrganization }}

      # NuGet release (Microsoft.DurableTask.Client)
      - job: nugetRelease_Microsoft_DurableTask_Client
